# Nginx site for pinnaclepublishinggroup.net (booksales project)
# Same VM as wearencc.org (34.30.208.144)
#
# WARNING: On this server Pinnacle is served by Apache with TLS already configured.
# Do NOT enable this file on port 80/443 while Apache owns those ports.
#
# Install (only if you migrated Pinnacle off Apache to nginx):
#   sudo mkdir -p /var/www/booksales
#   sudo cp deploy/nginx/pinnaclepublishinggroup.net.conf /etc/nginx/sites-available/pinnaclepublishinggroup.net
#   sudo ln -sf /etc/nginx/sites-available/pinnaclepublishinggroup.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pinnaclepublishinggroup.net www.pinnaclepublishinggroup.net;

    # Adjust if your booksales files live elsewhere on the VM:
    root /var/www/booksales;
    index index.html index.php;

    client_max_body_size 26M;

    # If booksales uses a Node API on another port, uncomment and set the port:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:4001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
