# Nginx site for wearencc.org
# Install: sudo cp deploy/nginx/wearencc.org.conf /etc/nginx/sites-available/wearencc.org
#          sudo ln -sf /etc/nginx/sites-available/wearencc.org /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Certbot (after DNS points here):
#   sudo certbot --nginx -d wearencc.org -d www.wearencc.org

server {
    listen 80;
    listen [::]:80;
    server_name wearencc.org www.wearencc.org;

    # Certbot will add HTTPS; keep this redirect after SSL is enabled:
    # return 301 https://$host$request_uri;

    root /var/www/wearencc;
    index index.html;

    client_max_body_size 26M;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
