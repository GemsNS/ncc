# Apache vhost for wearencc.org (NCC)
# HTTPS: Certbot on Apache — certs already on VM.
# DocumentRoot on this server: /var/www/wearencc.org/public_html
# Backend (Node) lives outside the web root: /var/www/wearencc.org/backend
#
# On this VM, merge ProxyPass lines into BOTH:
#   /etc/apache2/sites-enabled/wearencc.org.conf
#   /etc/apache2/sites-enabled/wearencc.org-le-ssl.conf
# (Certbot SSL vhosts often omit proxy rules until you add them.)

<VirtualHost *:80>
    ServerName wearencc.org
    ServerAlias www.wearencc.org
    DocumentRoot /var/www/wearencc.org/public_html

    DirectoryIndex index.html

    <Directory /var/www/wearencc.org/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    ProxyPass /uploads/ http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4000/uploads/

    ErrorLog ${APACHE_LOG_DIR}/wearencc-error.log
    CustomLog ${APACHE_LOG_DIR}/wearencc-access.log combined
</VirtualHost>
