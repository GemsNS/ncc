# Apache vhost for wearencc.org (NCC)
# Install on VM (after Pinnacle vhost is already working):
#   sudo cp /var/www/wearencc/deploy/apache/wearencc.org.conf /etc/apache2/sites-available/wearencc.org.conf
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo a2ensite wearencc.org.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
# SSL:
#   sudo certbot --apache -d wearencc.org -d www.wearencc.org --redirect

<VirtualHost *:80>
    ServerName wearencc.org
    ServerAlias www.wearencc.org
    DocumentRoot /var/www/wearencc

    DirectoryIndex index.html

    <Directory /var/www/wearencc>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    ProxyPass /uploads/ http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4000/uploads/

    ErrorLog ${APACHE_LOG_DIR}/wearencc-error.log
    CustomLog ${APACHE_LOG_DIR}/wearencc-access.log combined
</VirtualHost>
